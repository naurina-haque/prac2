
name: Java Docker Test

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t task .

      - name: Run Test Cases
        run: docker run --rm --entrypoint java task task.a1_task2Test
